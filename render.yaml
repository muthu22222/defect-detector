services:
  - type: web
    name: defect-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --force-reinstall --no-deps opencv-python-headless
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
